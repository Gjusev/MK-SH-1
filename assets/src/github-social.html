<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Geist';src:url('fonts/geist-500.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Geist';src:url('fonts/geist-700.woff2') format('woff2');font-weight:700}

*{margin:0;padding:0;box-sizing:border-box}

.sub{margin-top:26px;font-size:27px;color:#787774;letter-spacing:-0.015em;max-width:760px;line-height:1.45}
.url{position:absolute;bottom:64px;left:96px;font-family:'Geist Mono',monospace;font-size:16px;color:#787774}
.foot{position:absolute;bottom:64px;right:96px;font-family:'Geist Mono',monospace;font-size:16px;color:#346538}
</style></head><body>
<div class="wrap">
  <span class="mark"></span>
  <h1>MK-SH-1</h1>
  <p class="sub">Teaches a small model numeric order, without forgetting what it already knew</p>
</div>
<span class="url">github.com/Gjusev/MK-SH-1</span>
<span class="foot">E24-E35, pre-registered</span>
