<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Geist';src:url('fonts/geist-400.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Geist';src:url('fonts/geist-500.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Instrument Serif';src:url('fonts/instrumentserif-400.woff2') format('woff2');font-weight:400;font-style:normal}
@font-face{font-family:'Instrument Serif';src:url('fonts/instrumentserif-italic.woff2') format('woff2');font-weight:400;font-style:italic}
@font-face{font-family:'Geist Mono';src:url('fonts/geistmono-500.woff2') format('woff2');font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1000px;height:420px;background:#F7F6F3;font-family:'Geist',sans-serif;color:#111111;overflow:hidden}
.wrap{display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 72px}
.badge{align-self:flex-start;background:#FDEBEC;color:#9F2F2D;font-family:'Geist Mono',monospace;font-size:14px;padding:4px 12px;margin-bottom:26px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:58px;letter-spacing:-0.02em;line-height:1.08;max-width:820px}
h1 em{font-style:italic}
.sub{margin-top:22px;font-size:20px;color:#787774;letter-spacing:-0.01em}
</style></head><body>
<div class="wrap">
  <span class="badge">retracted -&gt; validated</span>
  <h1>We withdrew our own <em>headline result</em></h1>
  <p class="sub">A case study in pre-registered ML evaluation</p>
</div>
</body></html>
