<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Geist';src:url('fonts/geist-500.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Geist Mono';src:url('fonts/geistmono-400.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Geist Mono';src:url('fonts/geistmono-500.woff2') format('woff2');font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1560px;background:#F7F6F3;font-family:'Geist',sans-serif;color:#111111;padding:56px 56px 48px}
h1{font-weight:500;font-size:26px;letter-spacing:-0.02em}
.sub{font-family:'Geist Mono',monospace;font-size:14px;color:#787774;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;margin-top:34px}
.cell{background:#FFFFFF;border:1px solid #EAEAEA;padding:12px}
.cell img{width:100%;height:360px;object-fit:cover;display:block}
.name{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;padding:0 2px}
.n{font-family:'Geist Mono',monospace;font-weight:500;font-size:15px;letter-spacing:0.02em}
.k{font-family:'Geist Mono',monospace;font-size:12px;color:#787774}
.foot{margin-top:32px;border-top:1px solid #EAEAEA;padding-top:14px;font-family:'Geist Mono',monospace;font-size:12.5px;color:#787774;display:flex;justify-content:space-between}
</style></head><body>
<h1>MK-SH-1 - lote B: estilos</h1>
<p class="sub">same shark, ten directions - navy blues - 10 concepts</p>
<div class="grid">
  <div class="cell"><img src="style-1.png"><div class="name"><span class="n">TECNICO</span><span class="k">B1</span></div></div>
  <div class="cell"><img src="style-2.png"><div class="name"><span class="n">BRUTAL</span><span class="k">B2</span></div></div>
  <div class="cell"><img src="style-3.png"><div class="name"><span class="n">PAPEL</span><span class="k">B3</span></div></div>
  <div class="cell"><img src="style-4.png"><div class="name"><span class="n">PIXEL</span><span class="k">B4</span></div></div>
  <div class="cell"><img src="style-5.png"><div class="name"><span class="n">SUMI</span><span class="k">B5</span></div></div>
  <div class="cell"><img src="style-6.png"><div class="name"><span class="n">DECO</span><span class="k">B6</span></div></div>
  <div class="cell"><img src="style-7.png"><div class="name"><span class="n">MONOGRAM</span><span class="k">B7</span></div></div>
  <div class="cell"><img src="style-8.png"><div class="name"><span class="n">HALFTONE</span><span class="k">B8</span></div></div>
  <div class="cell"><img src="style-9.png"><div class="name"><span class="n">ISOMETRICO</span><span class="k">B9</span></div></div>
  <div class="cell"><img src="style-10.png"><div class="name"><span class="n">SELLO</span><span class="k">B10</span></div></div>
</div>
<div class="foot"><span>MK-SH-1 / lote B</span><span>style exploration</span></div>
</body></html>
