<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Geist';src:url('fonts/geist-500.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Geist Mono';src:url('fonts/geistmono-400.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Geist Mono';src:url('fonts/geistmono-500.woff2') format('woff2');font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1560px;background:#F7F6F3;font-family:'Geist',sans-serif;color:#111111;padding:56px 56px 48px}
h1{font-weight:500;font-size:26px;letter-spacing:-0.02em}
.sub{font-family:'Geist Mono',monospace;font-size:14px;color:#787774;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;margin-top:36px}
.cell{background:#FFFFFF;border:1px solid #EAEAEA;padding:14px}
.cell img{width:100%;display:block}
.name{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:0 2px}
.n{font-family:'Geist Mono',monospace;font-weight:500;font-size:16px;letter-spacing:0.02em}
.k{font-family:'Geist Mono',monospace;font-size:12.5px;color:#787774}
.foot{margin-top:36px;border-top:1px solid #EAEAEA;padding-top:14px;font-family:'Geist Mono',monospace;font-size:12.5px;color:#787774;display:flex;justify-content:space-between}
</style></head><body>
<h1>MK-SH-1 - mascot concepts</h1>
<p class="sub">gray statues breaking - anime tone - pick one</p>
<div class="grid">
  <div class="cell"><img src="statue-1.png"><div class="name"><span class="n">UMBRAL</span><span class="k">01</span></div></div>
  <div class="cell"><img src="statue-2.png"><div class="name"><span class="n">FRACTURA</span><span class="k">02</span></div></div>
  <div class="cell"><img src="statue-3.png"><div class="name"><span class="n">MONOLITH</span><span class="k">03</span></div></div>
  <div class="cell"><img src="statue-4.png"><div class="name"><span class="n">SHATTER</span><span class="k">04</span></div></div>
  <div class="cell"><img src="statue-5.png"><div class="name"><span class="n">AWAKEN</span><span class="k">05</span></div></div>
  <div class="cell"><img src="statue-6.png"><div class="name"><span class="n">BALANCE</span><span class="k">06</span></div></div>
</div>
<div class="foot"><span>MK-SH-1 / mascot exploration</span><span>generated + labeled</span></div>
</body></html>
